<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
     <link rel="stylesheet" href="{{url_for('static', filename='css/cadastro.css')}}">
    <title>Cadastro</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body data-user-logged-in="{{ 'true' if session.get('usuario_logado') else 'false' }}" data-user-role="{{ (session.get('usuario_role') or '')|lower }}">
    <div class="cadastro-container">
        <h2>Cadastro de Usuário</h2>
    <form id="cadastroForm" method="POST" action="/cadastro">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required autocomplete="new-password">
            </div>
            {% if session.get('usuario_role') and session.get('usuario_role')|lower == 'admin' %}
            <div class="form-group">
                <fieldset class="role-options" id="role-selection">
                    <legend>Tipo de usuário</legend>
                    <label for="role-admin"><input id="role-admin" type="radio" name="role" value="admin" autocomplete="off"> ADM</label>
                    <label for="role-professor"><input id="role-professor" type="radio" name="role" value="professor" checked autocomplete="off"> Professor</label>
                </fieldset>
                <small>O ADM pode marcar se o novo usuário também será ADM ou um Professor.</small>
            </div>
            {% endif %}
            <button class="cadastro-btn" type="submit">Cadastrar</button>
        </form>

        <div class="actions">
            <a href="{{ url_for('index') }}" class="voltar-btn">&larr; Voltar ao Menu</a>
        </div>

        <div id="mensagem"></div>
    </div>


    <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
</body>
</html>
